<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mdview</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <button id="browse" type="button" aria-label="Browse Markdown files" aria-expanded="false" aria-controls="browser" title="Files">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M1.8 4.2h4.1l1.3 1.5H14.2V12.6H1.8V4.2z" />
      </svg>
    </button>
    <button id="browse-scrim" type="button" aria-label="Close file browser" hidden></button>
    <div id="shell">
      <aside id="browser" hidden>
        <div class="browser-bar">
          <div class="browser-title">
            <p class="browser-kicker">Files</p>
            <p id="browser-root"></p>
          </div>
          <button id="browse-up" type="button" aria-label="Enclosing folder" title="Enclosing folder" hidden>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M8 12.5V3.8M4.2 7.2 8 3.5l3.8 3.7" />
            </svg>
          </button>
          <button id="browse-close" type="button" aria-label="Close file browser" title="Close">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M10.2 3.4 5.6 8l4.6 4.6" />
            </svg>
          </button>
        </div>
        <nav id="tree" aria-label="Markdown files"></nav>
      </aside>
      <article id="doc"></article>
    </div>
    <div id="diagram-overlay" hidden>
      <button id="diagram-close" type="button">Close</button>
      <div id="diagram-stage" class="diagram-view" tabindex="0"></div>
    </div>
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/mermaid.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
